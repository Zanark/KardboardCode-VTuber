[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kardboard-vtuber"
version = "1.2.2"
description = "A lightweight PS1-style camera-tracked KardboardCode avatar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.12,<6",
    "numpy>=2.0,<3",
    "opencv-contrib-python>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "Pillow>=12,<13",
    "fonttools>=4.60,<5",
    "packaging>=25,<27",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
tracking = [
    "mediapipe>=0.10.35,<0.11; python_version < '3.13'",
]
virtual-camera = [
    "pyvirtualcam>=0.14,<1",
]
gui = [
    "PySide6-Essentials>=6.8,<7",
    "cv2-enumerate-cameras>=1.4,<2; sys_platform == 'win32'",
    "av>=16,<17",
]

[project.scripts]
kardboard-camera = "kardboard_vtuber.cli:main"
kardboard-video = "kardboard_vtuber.video_cli:main"

[project.gui-scripts]
kardboard-studio = "kardboard_vtuber.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kardboard_vtuber"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/download_face_landmarker_model.py" = "kardboard_vtuber/_tools/download_face_landmarker_model.py"
"scripts/download_hand_landmarker_model.py" = "kardboard_vtuber/_tools/download_hand_landmarker_model.py"
"scripts/download_pose_landmarker_model.py" = "kardboard_vtuber/_tools/download_pose_landmarker_model.py"
"scripts/download_selfie_segmenter_model.py" = "kardboard_vtuber/_tools/download_selfie_segmenter_model.py"
"scripts/list_local_cameras.py" = "kardboard_vtuber/_tools/list_local_cameras.py"
"scripts/record_guided_regression.py" = "kardboard_vtuber/_tools/record_guided_regression.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
